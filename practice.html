<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 40px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        h2 {
            color: #ffb700;
            margin: 30px 0 15px;
            font-size: 1.8rem;
        }

        p {
            margin-bottom: 15px;
            color: #c4c4c4;
        }

        .practice-section {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #ffd700;
        }

        code {
            background: #0a0a0a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ffd700, #ffb700);
            color: #0f0f0f;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            margin: 10px 10px 10px 0;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Practice & Experiments</h1>
        
        <div class="practice-section">
            <h2>Welcome to Your Practice Page</h2>
            <p>This is your space to experiment with HTML, CSS, and JavaScript.</p>
            <p>Feel free to modify this page and test new ideas!</p>
        </div>

        <div class="practice-section">
            <h2>Quick Links</h2>
            <a href="index.html" class="btn">Back to Main Site</a>
            <a href="#" class="btn">Test Button</a>
        </div>

        <div class="practice-section">
            <h2>Practice Area</h2>
            <p>Add your code experiments below:</p>
            <!-- Your practice code here -->
        </div>
    </div>

    <script>
        // Your practice JavaScript here
        console.log('Practice page loaded!');
    </script>
</body>
</html>
